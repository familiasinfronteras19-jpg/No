<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00a20e">
<title>Crear cuenta - Tareas</title>
<link rel="icon" href="https://familiasinfronteras19-jpg.github.io/No/icon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <img class="logo" src="https://familiasinfronteras19-jpg.github.io/No/icon.png" alt="">
  <h1>Crear cuenta</h1>
  <form id="form">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña (mínimo 6 caracteres)</label>
    <input type="password" id="password" minlength="6" required autocomplete="new-password">

    <label for="confirmar">Repite la contraseña</label>
    <input type="password" id="confirmar" minlength="6" required autocomplete="new-password">

    <button type="submit" id="btn">Registrarse</button>
  </form>
  <div id="msg"></div>
  <div class="enlace">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></div>
</div>

<script>
  const API_URL = 'PEGA_AQUI_LA_URL_DEL_APPS_SCRIPT';
  const $ = id => document.getElementById(id);

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('msg');

    if ($('password').value !== $('confirmar').value) {
      msg.className = 'err';
      msg.textContent = 'Las contraseñas no coinciden.';
      return;
    }

    $('btn').disabled = true;
    msg.className = '';
    msg.textContent = 'Creando cuenta...';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'register',
          email: $('email').value,
          password: $('password').value
        })
      });
      const data = await res.json();

      if (data.ok) {
        msg.className = 'ok';
        msg.textContent = 'Cuenta creada. Te llevamos a iniciar sesión...';
        setTimeout(() => location.replace('index.html'), 1500);
        return;
      }

      msg.className = 'err';
      msg.textContent = data.error;
    } catch (err) {
      msg.className = 'err';
      msg.textContent = 'No se pudo conectar con el servidor.';
    }
    $('btn').disabled = false;
  });
</script>
</body>
</html>
