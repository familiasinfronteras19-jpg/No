<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00a20e">
<title>Iniciar sesión - Tareas</title>
<link rel="icon" href="https://familiasinfronteras19-jpg.github.io/No/icon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <img class="logo" src="https://familiasinfronteras19-jpg.github.io/No/icon.png" alt="">
  <h1>Iniciar sesión</h1>
  <form id="form">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="btn">Entrar</button>
  </form>
  <div id="msg"></div>
</div>

<script>
  // 1. Pega aquí el enlace CSV de tu hoja "Accounts" (Archivo > Compartir > Publicar en la web > CSV)
  const CSV_CUENTAS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0YJX2GY1wqKvB2zX8QGkkCopcUOfTWnxT8BclGIfUX4JWxBqsygD3sXv-Q1L3GMSA4viXH7o3pMkv/pubhtml';

  // 2. Ruta exacta a la pantalla principal de tus tareas
  const APP_URL = 'pagina.html';

  const $ = id => document.getElementById(id);

  // Si el usuario ya inició sesión antes en este navegador, entra directo
  if (localStorage.getItem('sesionEmail')) {
    location.replace(APP_URL);
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('msg');
    const emailIngresado = $('email').value.trim().toLowerCase();
    const passIngresada = $('password').value.trim();

    $('btn').disabled = true;
    msg.className = '';
    msg.textContent = 'Verificando cuenta...';

    try {
      // Se añade "&t=" con la hora actual para evitar que el navegador use una copia vieja en caché
      const res = await fetch(`${CSV_CUENTAS_URL}&t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Error al descargar las cuentas');

      const textoCsv = await res.text();
      // Separamos el archivo por líneas (ignorando líneas vacías)
      const filas = textoCsv.split(/\r?\n/).filter(linea => linea.trim() !== '');

      let cuentaValida = false;

      // Empezamos en i = 1 para saltar la fila 1 de encabezados (Email, Password)
      for (let i = 1; i < filas.length; i++) {
        const columnas = filas[i].split(',');
        const emailHoja = (columnas[0] || '').replace(/^"|"$/g, '').trim().toLowerCase();
        const passHoja = (columnas[1] || '').replace(/^"|"$/g, '').trim();

        if (emailHoja === emailIngresado && passHoja === passIngresada) {
          cuentaValida = true;
          break;
        }
      }

      if (cuentaValida) {
        localStorage.setItem('sesionEmail', emailIngresado);
        msg.className = 'ok';
        msg.textContent = '¡Bienvenido! Entrando a la app...';
        setTimeout(() => location.replace(APP_URL), 800);
        return;
      }

      msg.className = 'err';
      msg.textContent = 'Correo o contraseña incorrectos.';
    } catch (err) {
      msg.className = 'err';
      msg.textContent = 'No se pudo conectar con la lista de cuentas.';
    }

    $('btn').disabled = false;
  });
</script>
</body>
</html>
