<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00a20e">
<title>Iniciar sesión - Tareas</title>
<link rel="icon" href="https://familiasinfronteras19-jpg.github.io/No/icon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <img class="logo" src="https://familiasinfronteras19-jpg.github.io/No/icon.png" alt="">
  <h1>Iniciar sesión</h1>
  <form id="form">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="btn">Entrar</button>
  </form>
  <div id="msg"></div>
</div>

<script>
  // 1. Enlace CSV de la hoja "Accounts"
  const CSV_CUENTAS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0YJX2GY1wqKvB2zX8QGkkCopcUOfTWnxT8BclGIfUX4JWxBqsygD3sXv-Q1L3GMSA4viXH7o3pMkv/pub?output=csv';

  // 2. Ruta exacta a la pantalla principal de tus tareas
  const APP_URL = 'pagina.html';

  const ROLES_VALIDOS = ['estudiante', 'admin', 'creador'];
  const $ = id => document.getElementById(id);

  // Separa una línea CSV respetando las comillas
  function parsearLinea(linea) {
    const celdas = [];
    let actual = '', entreComillas = false;
    for (let i = 0; i < linea.length; i++) {
      const c = linea[i];
      if (c === '"') {
        if (entreComillas && linea[i + 1] === '"') { actual += '"'; i++; }
        else entreComillas = !entreComillas;
      } else if (c === ',' && !entreComillas) {
        celdas.push(actual); actual = '';
      } else {
        actual += c;
      }
    }
    celdas.push(actual);
    return celdas.map(c => c.trim());
  }

  // Si ya hay sesión completa (correo y rol), entra directo
  if (localStorage.getItem('sesionEmail') && localStorage.getItem('sesionRol')) {
    location.replace(APP_URL);
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('msg');
    const emailIngresado = $('email').value.trim().toLowerCase();
    const passIngresada = $('password').value.trim();

    $('btn').disabled = true;
    msg.className = '';
    msg.textContent = 'Verificando cuenta...';

    try {
      const res = await fetch(`${CSV_CUENTAS_URL}&t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Error al descargar las cuentas');

      const textoCsv = await res.text();
      const filas = textoCsv.split(/\r?\n/).filter(linea => linea.trim() !== '');

      let cuentaValida = false;
      let rolEncontrado = '';

      for (let i = 1; i < filas.length; i++) { // i = 1 salta el encabezado
        const [emailHoja, passHoja, rolHoja] = parsearLinea(filas[i]);
        if (emailHoja.toLowerCase() === emailIngresado && passHoja === passIngresada) {
          cuentaValida = true;
          rolEncontrado = (rolHoja || '').toLowerCase();
          break;
        }
      }

      if (cuentaValida) {
        const rol = ROLES_VALIDOS.includes(rolEncontrado) ? rolEncontrado : 'estudiante';
        localStorage.setItem('sesionEmail', emailIngresado);
        localStorage.setItem('sesionRol', rol);
        sessionStorage.setItem('sesionPass', passIngresada);

        msg.className = 'ok';
        msg.textContent = '¡Bienvenido! Entrando a la app...';
        setTimeout(() => location.replace(APP_URL), 800);
        return;
      }

      msg.className = 'err';
      msg.textContent = 'Correo o contraseña incorrectos.';
    } catch (err) {
      msg.className = 'err';
      msg.textContent = 'No se pudo conectar con la lista de cuentas.';
    }

    $('btn').disabled = false;
  });
</script>
</body>
</html>
