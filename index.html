<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00a20e">
<title>Iniciar sesión - Tareas</title>
<link rel="icon" href="https://familiasinfronteras19-jpg.github.io/No/icon.png" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <img class="logo" src="https://familiasinfronteras19-jpg.github.io/No/icon.png" alt="">
  <h1>Iniciar sesión</h1>
  <form id="form">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="btn">Entrar</button>
  </form>
  <div id="msg"></div>
  <div class="enlace">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
</div>

<script>
  const API_URL = 'PEGA_AQUI_LA_URL_DEL_APPS_SCRIPT';
  const APP_URL = 'https://familiasinfronteras19-jpg.github.io/No/';
  const $ = id => document.getElementById(id);

  // Si ya hay sesión iniciada, ir directo a la app
  if (localStorage.getItem('sesionEmail')) {
    location.replace(APP_URL);
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const msg = $('msg');

    $('btn').disabled = true;
    msg.className = '';
    msg.textContent = 'Entrando...';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'login',
          email: $('email').value,
          password: $('password').value
        })
      });
      const data = await res.json();

      if (data.ok) {
        localStorage.setItem('sesionEmail', data.email);
        msg.className = 'ok';
        msg.textContent = '¡Bienvenido! Entrando a la app...';
        setTimeout(() => location.replace(APP_URL), 800);
        return;
      }

      msg.className = 'err';
      msg.textContent = data.error;
    } catch (err) {
      msg.className = 'err';
      msg.textContent = 'No se pudo conectar con el servidor.';
    }
    $('btn').disabled = false;
  });
</script>
</body>
</html>
